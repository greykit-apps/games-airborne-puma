<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>og.png</title>
<!-- The share card (og.png, 1200x630), laid out as the family's are (a cyan
     rule, the wordmark with "Puma" in cyan, the description, a tagline, the
     icon top right) over a scene in the play screen's own art at three times:
     the desert outside the depot, two rangers and a pod coming down behind
     the Osprey, and a wolf who suspects something. Serve the repo over http,
     open tools/og.html, and save the canvas (window.ogPNG() is its data URL),
     or screenshot it headless at 1200x630:
       msedge --headless --hide-scrollbars --window-size=1200,630
              --screenshot=og.png http://127.0.0.1:8766/tools/og.html
     iconArt() composes the icon's drawing and prints it for
     tools/make-icons.js. Not deployed. -->
<style>body{margin:0;background:#222;overflow:hidden}canvas{display:block}</style>
</head>
<body>
<canvas id="og" width="1200" height="630"></canvas>
<script src="../js/util.js"></script>
<script src="../js/kit.js"></script>
<script src="../js/palette.js"></script>
<script src="../js/tiles.js"></script>
<script src="../js/art.js"></script>
<script src="../js/ground.js"></script>
<script src="../js/things.js"></script>
<script src="../js/people.js"></script>
<script src="../js/engine/const.js"></script>
<script src="../js/engine/mapgen.js"></script>
<script src="../js/missions.js"></script>
<script src="../js/render.js"></script>
<script>
"use strict";
(() => {
  const K = AP.K;
  /* the scene, 400 x 210, in the play screen's pixels: the depot map the
   * title flies over, a little south of the compound */
  const W = 400, H = 210, sc = K.mk(W, H), sg = sc.getContext("2d");
  sg.imageSmoothingEnabled = false;
  const map = AP.genMap({ mission: "depot", diff: 1, seed: 11 });
  sg.drawImage(AP.Render.thumb(map, map.zone, Math.max(0, map.goal.y0 - 5), 14, K.TS), -40, 0);
  const shadow = (x, y, rx, ry, a) => { sg.globalAlpha = a; sg.fillStyle = K.OUT; sg.beginPath(); sg.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); sg.fill(); sg.globalAlpha = 1; };
  /* as js/render.js draws them: a ranger under the parafoil z pixels up, a pod on its canopy, a soldier with a mark over him */
  const ranger = (x, y, z) => {
    const man = AP.personArt("ranger", 8, "stand", 0), can = AP.chuteArt(), top = y - man.ay - z;
    shadow(x + 4 + z * 0.3, y - z * 0.12, 6, 2.5, 0.32);
    sg.drawImage(man, x - man.ax, top); sg.drawImage(can, x - (can.width >> 1), top - can.height - 4);
  };
  const pod = (x, y, z) => { const p = AP.podArt(true); sg.fillStyle = "rgba(0,0,0,.35)"; sg.fillRect(x - 3, y, 6, 2); sg.drawImage(p, x - p.width / 2, y - p.height - z); };
  const wolf = (x, y, f, ch) => { const p = AP.personArt("rifle", f, "stand", 0), m = AP.markArt(ch); sg.drawImage(p, x - p.ax, y - p.ay); sg.drawImage(m, x - (m.width >> 1) + 1, y - p.ay - m.height + 4); };
  wolf(378, 200, 20, "?");
  pod(302, 118, 74);
  ranger(262, 166, 62);
  ranger(236, 196, 10);
  /* the Osprey, heading east, as the title draws it */
  const osp = AP.ospreyArt(2, true);
  shadow(392, 162, 34, 11, 0.28);
  sg.save(); sg.translate(352, 112); sg.rotate(-Math.PI / 2); sg.drawImage(osp, -osp.width, -osp.height, osp.width * 2, osp.height * 2); sg.restore();
  /* the stage's light, as css/airbornepuma.css lays it over the play screen */
  const layer = (op, paint) => { sg.save(); sg.globalCompositeOperation = op; paint(); sg.restore(); };
  layer("soft-light", () => { const r = sg.createRadialGradient(-0.06 * W, 1.04 * H, 0, -0.06 * W, 1.04 * H, 0.66 * W); r.addColorStop(0, "rgba(255,200,120,.62)"); r.addColorStop(1, "rgba(255,206,138,0)"); sg.fillStyle = r; sg.fillRect(0, 0, W, H); });
  layer("multiply", () => { const l = sg.createLinearGradient(0, H, W * 0.8, 0); l.addColorStop(0.4, "rgba(0,0,0,0)"); l.addColorStop(1, "rgba(64,54,132,.32)"); sg.fillStyle = l; sg.fillRect(0, 0, W, H); });

  const cv = document.getElementById("og"), g = cv.getContext("2d");
  g.imageSmoothingEnabled = false;
  g.drawImage(sc, 0, 0, 1200, 630);
  /* a shade under the words, from the left */
  const sh = g.createLinearGradient(0, 0, 640, 0);
  sh.addColorStop(0, "rgba(5,7,15,.96)"); sh.addColorStop(0.6, "rgba(5,7,15,.82)"); sh.addColorStop(1, "rgba(5,7,15,0)");
  g.fillStyle = sh; g.fillRect(0, 0, 640, 630);
  g.fillStyle = "#54f2ff"; g.fillRect(0, 0, 1200, 8);
  const mono = 'Menlo, Consolas, "DejaVu Sans Mono", "Courier New", monospace';
  g.textBaseline = "alphabetic";
  g.font = `bold 84px ${mono}`;
  g.fillStyle = "#e9e9f2"; g.fillText("Airborne", 72, 150);
  g.fillStyle = "#54f2ff"; g.fillText("Puma", 72 + g.measureText("Airborne ").width, 150);
  g.font = `32px ${mono}`; g.fillStyle = "#b4bac6";
  ["Twelve missions behind enemy", "lines: an Osprey, three supply", "pods and a clock running."].forEach((l, i) => g.fillText(l, 72, 230 + i * 44));
  g.font = `26px ${mono}`; g.fillStyle = "#54f2ff";
  g.fillText("A remake of Airborne Ranger (C64, 1987)", 72, 566);
  /* the icon, top right */
  const img = new Image();
  img.onload = () => {
    g.drawImage(img, 1010, 40, 130, 130);
    window.ogReady = true; document.title = "ready";
  };
  img.src = "../icon.svg?" + Date.now();   // never a cached copy of an old icon
  window.ogPNG = () => cv.toDataURL("image/png");

  /* the icon's drawing, 40 x 40: the ranger under his parafoil over a dusk
   * sky in seven dithered steps. Prints PAL and ART for tools/make-icons.js. */
  window.iconArt = () => {
    const S = 40, c = K.mk(S, S), x = c.getContext("2d");
    const RAMP = ["#0a1022", "#111a33", "#1b2442", "#2c2c4a", "#4a3a4a", "#7a4a48", "#b0684a"];
    for (let y = 0; y < S; y++) for (let i = 0; i < S; i++) {
      const t = Math.pow(y / (S - 1), 1.6) * (RAMP.length - 1) + K.bayer(i, y) * 0.9;
      x.fillStyle = RAMP[Math.max(0, Math.min(RAMP.length - 1, Math.round(t)))]; x.fillRect(i, y, 1, 1);
    }
    for (const [i, y, b] of [[4, 5, 1], [33, 4, 0], [29, 12, 0], [6, 17, 0], [36, 20, 1], [2, 27, 0], [13, 3, 0]]) { x.fillStyle = b ? "#e8ecff" : "#8090c0"; x.fillRect(i, y, 1, 1); }
    const man = AP.personArt("ranger", 8, "stand", 0), can = AP.chuteArt();
    x.drawImage(can, Math.round((S - can.width) / 2), 1);
    x.drawImage(man, Math.round(S / 2 - man.ax), 8);
    const d = x.getImageData(0, 0, S, S).data, keys = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&*+=?~^";
    const pal = {}, rev = {}, rows = [];
    for (let y = 0; y < S; y++) {
      let r = "";
      for (let i = 0; i < S; i++) {
        const o = (y * S + i) * 4, h = "#" + [d[o], d[o + 1], d[o + 2]].map(v => v.toString(16).padStart(2, "0")).join("");
        if (!(h in rev)) { const k = keys[Object.keys(pal).length]; rev[h] = k; pal[k] = h; }
        r += rev[h];
      }
      rows.push(r);
    }
    const out = `const PAL = ${JSON.stringify(pal)};\nconst ART = [\n${rows.map(r => `  "${r}",`).join("\n")}\n];`;
    console.log(out);
    return out;
  };
})();
</script>
</body>
</html>
